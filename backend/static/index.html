<!DOCTYPE html>

  <title>INGAMAR - Data Visualization Platform</title>
  <script>
    (function() {
      try {
        var theme = JSON.parse(localStorage.getItem('ingamar-theme') || '{}');
        var isDark = theme.state && theme.state.darkMode;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {
        // Default to light mode on error
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <style>
    /* Prevent flash of unstyled content */
    html { opacity: 0; }
    html.dark body { background-color: #141414; color: #e5e7eb; }
    html.light body { background-color: #f5f7fa; color: #374151; }
  </style>
