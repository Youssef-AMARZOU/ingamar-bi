<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="build" content="2026-05-26-v3" />
  <title>INGAMAR BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function() {
      try {
        var theme = JSON.parse(localStorage.getItem('ingamar-theme') || '{}');
        document.documentElement.setAttribute('data-theme', (theme.state && theme.state.darkMode) ? 'dark' : 'light');
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      document.documentElement.setAttribute('data-loading', '');
    })();
  </script>
  <style>
    [data-theme="light"] body { background: #f4f5f5; }
    [data-theme="dark"] body { background: #111217; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script src="https://js.puter.com/v2/"></script>
</body>
</html>
