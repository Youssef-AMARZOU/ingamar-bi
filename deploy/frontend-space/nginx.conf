server {
    listen 7860;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend Space
    location /api/ {
        proxy_pass https://ysfmo98-ingamar-bi-backend.hf.space;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
